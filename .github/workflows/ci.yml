name: C++ starter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  ui-smoke:
    name: SDL3 prototype (Linux)
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: "3.2.28"
      SDL_SHA256: 1330671214d146f8aeb1ed399fc3e081873cdb38b5189d1f8bb6ab15bbc04211
    steps:
      - uses: actions/checkout@v4
      - name: Build SDL3
        run: |
          archive="SDL3-${SDL_VERSION}.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://www.libsdl.org/release/${archive}" -o "${RUNNER_TEMP}/${archive}"
          echo "${SDL_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          # This job uses SDL's dummy video and audio drivers.
          cmake -S "${RUNNER_TEMP}/SDL3-${SDL_VERSION}" -B "${RUNNER_TEMP}/sdl-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/sdl-install" \
            -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_TEST_LIBRARY=OFF
          cmake --build "${RUNNER_TEMP}/sdl-build" --parallel
          cmake --install "${RUNNER_TEMP}/sdl-build"
      - name: Build SDL3 prototype
        run: |
          cmake -S apps/ui_prototype -B build-ui -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/sdl-install"
          cmake --build build-ui --parallel
      - name: Run CTest and SDL smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ctest --test-dir build-ui --output-on-failure
          prototype="${PWD}/build-ui/ui_prototype"
          cd "${RUNNER_TEMP}"
          "${prototype}" --smoke-test
